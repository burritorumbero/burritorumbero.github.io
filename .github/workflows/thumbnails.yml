name: Comic images

# When comic pages are pushed to gallery/<name>/pages/, generate their
# thumbnails and rebuild the gallery pages, then commit the results.
#
# Shares a concurrency group with the site build workflow so the two never
# push at the same time, and rebases before pushing in case the other one
# committed first.

on:
  push:
    branches: [main]
    paths:
      - "gallery/**/pages/**"
      - "gallery/**/gallery.json"
      # Generated output is excluded so this job cannot retrigger itself.
      - "!gallery/**/pages/thumbnails/**"
      - "!gallery/**/pages/variants/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Generate thumbnails
        run: python3 tools/make-thumbnails.py

      # Resized AVIF/WebP copies of each page, so the reader serves a size
      # that matches the screen instead of the full-resolution original.
      - name: Generate responsive page variants
        run: python3 tools/make-page-variants.py

      - name: Rebuild gallery pages
        run: python3 tools/build-gallery.py

      - name: Stamp the shared shell
        run: python3 tools/build-shell.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Build comic images + gallery pages [skip ci]"
            git pull --rebase origin main
            git push
          fi
