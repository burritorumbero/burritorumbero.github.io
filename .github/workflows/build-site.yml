name: Build site

# Rebuilds story pages, chapter pages and the shared shell whenever you push.
# You only ever commit drafts and story.json; the generated HTML is committed
# back by this job, so GitHub Pages keeps serving plain static files.

on:
  push:
    branches: [main]
    paths:
      - "stories/**/drafts/**"
      - "stories/**/story.json"
      - "stories/**/assets/**"
      - "tools/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r tools/requirements.txt

      - name: Build story and chapter pages
        run: python3 tools/build-stories.py

      - name: Stamp the shared shell into every page
        run: python3 tools/build-shell.py

      - name: Commit the generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Rebuild pages [skip ci]"
            git push
          fi
