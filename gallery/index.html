
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — Burrito Rumbero</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/styles.css">

  <!-- Start the hero download in parallel with the CSS. Keep these values
       identical to the winning <source> in the <picture> below, or the browser
       downloads the hero twice. When you enable AVIF, update type + filenames. -->
  <link
    rel="preload"
    as="image"
    type="image/webp"
    imagesrcset="../assets/hero-1280.webp 1280w,
                 ../assets/hero-1920.webp 1920w,
                 ../assets/hero-2560.webp 2560w"
    imagesizes="100vw"
    fetchpriority="high">

  <link rel="stylesheet" href="../stories/css/stories.css">
</head>
<body>

  <!-- ============ HERO ============ -->
  <header class="hero">
    <!-- The opacity fade (100% top → 5% bottom) is applied in CSS via mask-image.
         Generate the sized variants with tools/optimize-hero.sh.

         IMPORTANT: uncomment the AVIF block only once the .avif files exist.
         If a browser matches a <source> and the file 404s, it shows a broken
         image — it does NOT fall through to the next <source>. -->
    <picture>
      <!--
      <source
        type="image/avif"
        srcset="../assets/hero-1280.avif 1280w,
                ../assets/hero-1920.avif 1920w,
                ../assets/hero-2560.avif 2560w"
        sizes="100vw">
      -->
      <source
        type="image/webp"
        srcset="../assets/hero-1280.webp 1280w,
                ../assets/hero-1920.webp 1920w,
                ../assets/hero-2560.webp 2560w"
        sizes="100vw">
      <img
        class="hero__bg"
        src="../assets/hero-placeholder.svg"
        srcset="../assets/hero-1280.jpg 1280w,
                ../assets/hero-1920.jpg 1920w,
                ../assets/hero-2560.jpg 2560w"
        sizes="100vw"
        width="2560" height="1350"
        alt=""
        fetchpriority="high"
        decoding="async">
    </picture>

    <!-- Danmaku layer: words from words.txt fly right → left -->
    <div class="danmaku" id="danmaku" aria-hidden="true"></div>

    <div class="hero__content">
      <div class="brand">
        <span class="brand__frame">
          <img src="../assets/logo-placeholder.svg" alt="Burrito Rumbero logo">
        </span>
        <p class="brand__titles">
          <span class="brand__name">Burrito Rumbero</span>
          <span class="brand__tag">3D Giantess</span>
        </p>
      </div>

      <a class="support-btn" href="https://example.com/support" target="_blank" rel="noopener">Support Me</a>
    </div>
  </header>

  <!-- ============ NAV ============ -->
  <nav class="site-nav" aria-label="Main navigation">
    <ul>
      <li><a href="../index.html">Home</a></li>
      <li><a href="../stories/index.html">Stories</a></li>
      <li><a href="../gallery/index.html" class="is-current" aria-current="page">Gallery</a></li>
      <li><a href="../links/index.html">Links</a></li>
      <li><a href="../about/index.html">About</a></li>
    </ul>
  </nav>

  <!-- ===== SWAPPABLE REGION =====
       The router replaces everything inside #page. Everything outside it comes
       from tools/shell/ — edit the templates there, not this file. -->
  <main class="page" id="page">
    <h2 class="section-title">Gallery</h2>

    <section class="story-grid">
      <!-- One card per comic: 16:9 art in gallery/art/, link to the comic folder. -->
      <article class="story-card">
        <a href="sample/index.html">
          <div class="story-card__art">
            <img src="art/sample.webp" alt="" width="1200" height="675"
                 loading="lazy" decoding="async">
          </div>
          <h3 class="story-card__title">Sample Comic</h3>
          <p class="story-card__tags">demo, replace me</p>
        </a>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 Burrito Rumbero</p>
  </footer>

  <!-- ============ MASCOT ============ -->
  <div class="mascot" id="mascot">
    <img src="../assets/mascot-placeholder.svg" alt="">
  </div>

  <script src="../js/script.js"></script>
  <script src="../js/router.js"></script>

</body>
</html>
