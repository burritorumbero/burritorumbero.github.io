<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burrito Rumbero — 3D Giantess</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">

  <!-- Start the hero download in parallel with the CSS. Keep these values
       identical to the winning <source> in the <picture> below, or the browser
       downloads the hero twice. When you enable AVIF, update type + filenames. -->
  <link
    rel="preload"
    as="image"
    type="image/webp"
    imagesrcset="assets/hero-1280.webp 1280w,
                 assets/hero-1920.webp 1920w,
                 assets/hero-2560.webp 2560w"
    imagesizes="100vw"
    fetchpriority="high">
</head>
<body>

  <!-- ============ HERO ============ -->
  <header class="hero">
    <!-- The opacity fade (100% top → 5% bottom) is applied in CSS via mask-image.
         Generate the sized variants with tools/optimize-hero.sh.

         IMPORTANT: uncomment the AVIF block only once the .avif files exist.
         If a browser matches a <source> and the file 404s, it shows a broken
         image — it does NOT fall through to the next <source>. -->
    <picture>
      <!--
      <source
        type="image/avif"
        srcset="assets/hero-1280.avif 1280w,
                assets/hero-1920.avif 1920w,
                assets/hero-2560.avif 2560w"
        sizes="100vw">
      -->
      <source
        type="image/webp"
        srcset="assets/hero-1280.webp 1280w,
                assets/hero-1920.webp 1920w,
                assets/hero-2560.webp 2560w"
        sizes="100vw">
      <img
        class="hero__bg"
        src="assets/hero-placeholder.svg"
        srcset="assets/hero-1280.jpg 1280w,
                assets/hero-1920.jpg 1920w,
                assets/hero-2560.jpg 2560w"
        sizes="100vw"
        width="2560" height="1350"
        alt=""
        fetchpriority="high"
        decoding="async">
    </picture>

    <!-- Danmaku layer: words from words.txt fly right → left -->
    <div class="danmaku" id="danmaku" aria-hidden="true"></div>

    <div class="hero__content">
      <div class="brand">
        <span class="brand__frame">
          <img src="assets/logo-placeholder.svg" alt="Burrito Rumbero logo">
        </span>
        <p class="brand__titles">
          <span class="brand__name">Burrito Rumbero</span>
          <span class="brand__tag">3D Giantess</span>
        </p>
      </div>

      <a class="support-btn" href="https://example.com/support" target="_blank" rel="noopener">Support Me</a>
    </div>
  </header>

  <!-- ============ NAV ============ -->
  <nav class="site-nav" aria-label="Main navigation">
    <ul>
      <li><a href="index.html" class="is-current" aria-current="page">Home</a></li>
      <li><a href="stories/index.html">Stories</a></li>
      <li><a href="gallery/index.html">Gallery</a></li>
      <li><a href="links/index.html">Links</a></li>
      <li><a href="about/index.html">About</a></li>
    </ul>
  </nav>

  <!-- ===== SWAPPABLE REGION =====
       The router replaces everything inside #page. Everything outside it is
       shell, generated by tools/build-shell.py — edit tools/shell/ instead. -->
  <main class="page" id="page">
    <h2 class="section-title">Latest Entries</h2>

    <section class="entries">
      <!-- FILLED-IN EXAMPLE: the link URL goes on the <a>, the thumbnail <img> goes
           inside .entry-card__thumb. Thumbnails should be square (1:1). -->
      <article class="entry-card">
        <a href="stories/the-rooftop-view/index.html">
          <div class="entry-card__thumb">
            <!-- loading="lazy" keeps below-the-fold thumbs out of the initial load -->
            <img src="assets/entries/rooftop-view.jpg" alt="Rooftop View"
                 width="700" height="700" loading="lazy" decoding="async">
          </div>
          <p class="entry-card__caption">Rooftop View</p>
        </a>
      </article>

      <!-- Empty cards below — copy the pattern above into each one. -->
      <article class="entry-card">
        <a href="#">
          <div class="entry-card__thumb"></div>
          <p class="entry-card__caption">Coming soon</p>
        </a>
      </article>
      <article class="entry-card">
        <a href="#">
          <div class="entry-card__thumb"></div>
          <p class="entry-card__caption">Coming soon</p>
        </a>
      </article>
      <article class="entry-card">
        <a href="#">
          <div class="entry-card__thumb"></div>
          <p class="entry-card__caption">Coming soon</p>
        </a>
      </article>
      <article class="entry-card">
        <a href="#">
          <div class="entry-card__thumb"></div>
          <p class="entry-card__caption">Coming soon</p>
        </a>
      </article>
      <article class="entry-card">
        <a href="#">
          <div class="entry-card__thumb"></div>
          <p class="entry-card__caption">Coming soon</p>
        </a>
      </article>
      <article class="entry-card">
        <a href="#">
          <div class="entry-card__thumb"></div>
          <p class="entry-card__caption">Coming soon</p>
        </a>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 Burrito Rumbero</p>
  </footer>

  <!-- ============ MASCOT ============ -->
  <div class="mascot" id="mascot">
    <img src="assets/mascot-placeholder.svg" alt="">
  </div>

  <script src="js/script.js"></script>
  <script src="js/router.js"></script>
</body>
</html>
